<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全能汉字笔画描红生成器 (带笔顺引导版)</title>
    <style>
        :root {
            --grid-color: #d81e06;
            --grid-size: 15mm;     /* 默认格子大小 */
            --font-family: "KaiTi", "STKaiti", "楷体", "DFKaiShu-GB5", "AR PL UKai CN", "AR PL UKai", serif;
        }

        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f5f5f5; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            -webkit-print-color-adjust: exact; 
            print-color-adjust: exact; 
        }

        /* --- 控制面板 --- */
        .controls {
            background: white; 
            padding: 20px 24px; 
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            max-width: 940px; 
            margin: 20px auto; 
            border-radius: 10px;
        }
        .controls h2 { 
            margin-top: 0; 
            color: #2c3e50; 
            display: flex; 
            align-items: center; 
            gap: 10px;
            font-size: 22px;
        }
        .badge {
            background: #e74c3c;
            color: white;
            font-size: 12px;
            padding: 3px 9px;
            border-radius: 12px;
            font-weight: normal;
        }
        
        .panel-section { 
            margin-bottom: 18px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 15px; 
        }
        .panel-section:last-of-type {
            border-bottom: none;
        }
        .section-label {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            display: block;
        }
        .category-title { font-size: 13px; color: #d81e06; font-weight: bold; margin: 10px 0 6px 0; }
        
        .stroke-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
        .stroke-btn {
            background: #fff; border: 1px solid #e0e0e0; border-radius: 6px;
            padding: 5px 2px; cursor: pointer; text-align: center; transition: all 0.2s;
            user-select: none;
        }
        .stroke-btn:hover { background: #f0f4ff; border-color: #3498db; transform: translateY(-2px); }
        .stroke-btn span.s-char { display: block; font-family: var(--font-family); font-size: 22px; color: #333; height: 28px; line-height: 28px;}
        .stroke-btn span.s-name { display: block; font-size: 11px; color: #777; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        textarea { 
            width: 100%; 
            height: 70px; 
            padding: 10px; 
            border: 1px solid #ccc; 
            border-radius: 6px;
            font-family: var(--font-family); 
            font-size: 18px; 
            box-sizing: border-box;
            resize: vertical;
        }
        textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 0 2px rgba(52,152,219,0.2);
        }

        /* 笔顺设置选项条 */
        .options-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px 20px;
            align-items: center;
            background: #fdfaf6;
            border: 1px solid #faecd8;
            padding: 12px 16px;
            border-radius: 6px;
            font-size: 14px;
            color: #555;
        }
        .options-bar label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .options-bar select {
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid #dcdfe6;
            background: #fff;
            font-size: 13px;
        }
        
        .action-bar { 
            text-align: right; 
            margin-top: 20px; 
            position: sticky; 
            bottom: 0; 
            background: white; 
            padding: 12px 0; 
            border-top: 2px solid #f0f0f0; 
            z-index: 100;
        }
        button { 
            padding: 9px 18px; 
            font-size: 15px; 
            border-radius: 6px; 
            cursor: pointer; 
            border: none; 
            margin-left: 8px; 
            font-weight: 500;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.9; }
        button.main { background-color: #2c3e50; color: white; }
        button.config { background-color: #e67e22; color: white; }
        button.print { background-color: #d81e06; color: white; font-weight: bold; }
        button.clear { background-color: #fff; border: 1px solid #dcdfe6; color: #606266; padding: 4px 10px; font-size: 12px;}

        /* --- 模态框 (配置用) --- */
        .modal {
            display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: #fff; padding: 24px; border-radius: 10px; width: 85%; max-width: 620px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .modal textarea { height: 180px; font-family: monospace; font-size: 12px; }

        /* --- A4 纸张 --- */
        .page {
            width: 210mm; min-height: 297mm; padding: 15mm 10mm; margin: 20px auto;
            background: white; box-shadow: 0 0 14px rgba(0,0,0,0.08);
            position: relative; display: flex; flex-direction: column; box-sizing: border-box;
        }
        .header {
            display: flex; justify-content: space-between; margin-bottom: 8mm;
            font-family: var(--font-family); border-bottom: 2px solid var(--grid-color);
            padding-bottom: 2mm; font-size: 14px;
        }
        .row { display: flex; margin-bottom: 3mm; gap: 2mm; justify-content: center; }
        
        .tianzige {
            width: var(--grid-size); height: var(--grid-size); border: 1px solid var(--grid-color);
            position: relative; display: flex; align-items: center; justify-content: center;
            box-sizing: border-box;
        }
        /* 田字格虚线 */
        .tianzige::before {
            content: ''; position: absolute; top: 50%; left: 0; right: 0; border-top: 1px dashed var(--grid-color); transform: translateY(-50%);
            pointer-events: none;
        }
        .tianzige::after {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0; border-left: 1px dashed var(--grid-color); transform: translateX(-50%);
            pointer-events: none;
        }

        /* 笔画引导格专用（可选择隐藏内部虚线） */
        .tianzige.no-grid::before, .tianzige.no-grid::after { display: none; }

        .char { 
            font-family: var(--font-family); 
            font-size: calc(var(--grid-size) * 0.78); 
            z-index: 1; 
            position: relative; 
            line-height: 1;
            user-select: none;
        }
        .black { color: #000; }
        .trace { 
             color: #000000; 
             opacity: 0.32; /* 描红淡化 */
        }

        /* 笔顺 Canvas / SVG 覆盖层 */
        .stroke-canvas, .stroke-svg {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 2; pointer-events: none;
        }

        @media print {
            body { background: white; margin: 0; }
            .controls, .modal { display: none !important; }
            .page { margin: 0; box-shadow: none; page-break-after: always; height: 297mm; }
        }
    </style>
</head>
<body>

    <div class="controls">
        <h2>全能硬笔书法字帖 <span class="badge">带笔顺引导升级版</span></h2>

        <!-- 笔画选择面板 -->
        <div class="panel-section">
            <span class="section-label">常用笔画库（点击快速追加到模式1）：</span>
            <div class="category-title">一、基础笔画</div>
            <div class="stroke-grid" id="group-basic"></div>
            <div class="category-title">二、折笔与钩法</div>
            <div class="stroke-grid" id="group-hook"></div>
            <div class="category-title">三、复杂复合笔画</div>
            <div class="stroke-grid" id="group-complex"></div>
        </div>

        <!-- 选项配置 -->
        <div class="panel-section">
            <span class="section-label">笔顺与字帖排版配置：</span>
            <div class="options-bar">
                <label>
                    <input type="checkbox" id="optShowStrokeNumber" checked onchange="generate()">
                    <strong>首格标出笔顺数字</strong>
                </label>
                <label>
                    <strong>排版模式：</strong>
                    <select id="optLayoutMode" onchange="generate()">
                        <option value="semi" selected>半引导 (1范字 + 1描红 + 3空白 + 1描红 + 3空白)</option>
                        <option value="full">全描红 (1范字 + 8描红)</option>
                        <option value="half">半红半空 (1范字 + 4描红 + 4空白)</option>
                        <option value="blank">自写模式 (1范字 + 8空白)</option>
                    </select>
                </label>
                <label>
                    数字展示样式：
                    <select id="optNumberStyle" onchange="generate()">
                        <option value="plain-black" selected>纯黑数字 (无底圈·清爽极简)</option>
                        <option value="plain-red">纯红数字 (无底圈·鲜明)</option>
                        <option value="black-circle">白底黑字黑圈 (经典印刷风)</option>
                        <option value="red">红底白字 (醒目徽标)</option>
                        <option value="blue">蓝底白字</option>
                    </select>
                </label>
                <label>
                    数字大小：
                    <select id="optNumberSize" onchange="generate()">
                        <option value="large" selected>大号清晰 (推荐)</option>
                        <option value="xlarge">特大粗体</option>
                        <option value="medium">标准适中</option>
                        <option value="small">精巧小号</option>
                    </select>
                </label>
                <label>
                    首字底色：
                    <select id="optCharTone" onchange="generate()">
                        <option value="gray" selected>浅灰底字 (推荐，数字最清晰)</option>
                        <option value="light">极浅灰 (水印描红)</option>
                        <option value="black">纯黑标准字</option>
                    </select>
                </label>
                <label>
                    田字格尺寸：
                    <select id="optGridSize" onchange="updateGridSize()">
                        <option value="15mm" selected>15mm (标准练字格)</option>
                        <option value="17mm">17mm (中小学字帖)</option>
                        <option value="20mm">20mm (大格/启蒙)</option>
                    </select>
                </label>
            </div>
        </div>

        <!-- 输入区 -->
        <div class="panel-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span class="section-label" style="margin-bottom:0;">模式 1：笔画 + 范字</span>
                <button class="clear" onclick="document.getElementById('mode1Input').value=''">清空</button>
            </div>
            <textarea id="mode1Input">丶,主
丨,中</textarea>
        </div>

        <div class="panel-section">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                <span class="section-label" style="margin-bottom:0;">模式 2：整字练习 (首字自动标注笔画顺序)</span>
                <button class="clear" onclick="document.getElementById('mode2Input').value=''">清空</button>
            </div>
            <textarea id="mode2Input" placeholder="输入汉字...">永和九年</textarea>
        </div>

        <div class="action-bar">
            <button class="config" onclick="openConfig()">🛠 自定义笔画轨迹</button>
            <button class="main" onclick="generate()">⚡ 生成预览</button>
            <button class="print" onclick="window.print()">🖨 打印 / 导出PDF</button>
        </div>
    </div>

    <!-- 打印区域 -->
    <div id="print-area"></div>

    <!-- 配置模态框 -->
    <div id="configModal" class="modal">
        <div class="modal-content">
            <h3>导入/自定义单笔画轨迹</h3>
            <p style="font-size:12px; color:#666">如需手动覆盖单笔画的红线轨迹，请在此粘贴 JSON 配置：</p>
            <textarea id="configInput" placeholder="在此粘贴 const strokePaths = { ... };"></textarea>
            <div style="text-align:right; margin-top:12px;">
                <button class="clear" onclick="closeConfig()">取消</button>
                <button class="main" onclick="saveConfig()">保存并应用</button>
            </div>
        </div>
    </div>

    <script>
        // 完整的 Unicode CJK Strokes 笔画列表
        const strokeData = {
            basic: [
                { name: "点", char: "丶", ex: "主" }, { name: "横", char: "一", ex: "王" },
                { name: "竖", char: "丨", ex: "中" }, { name: "撇", char: "㇒", ex: "金" },
                { name: "捺", char: "㇏", ex: "大" }, { name: "提", char: "㇀", ex: "冰" },
                { name: "竖撇", char: "丿", ex: "月" }
            ],
            hook: [
                { name: "横钩", char: "㇖", ex: "买" }, { name: "横折钩", char: "㇆", ex: "羽" },
                { name: "竖钩", char: "亅", ex: "小" }, { name: "竖提", char: "㇙", ex: "长" },
                { name: "弯钩", char: "㇁", ex: "家" }, { name: "卧钩", char: "㇃", ex: "心" },
                { name: "斜钩", char: "㇂", ex: "飞" }, { name: "竖弯", char: "㇄", ex: "西" }
            ],
            complex: [
                { name: "竖弯钩", char: "乚", ex: "礼" }, { name: "横折", char: "㇕", ex: "口" },
                { name: "竖折", char: "㇗", ex: "山" }, { name: "撇折", char: "㇜", ex: "去" },
                { name: "撇点", char: "㇛", ex: "女" }, { name: "横折提", char: "㇊", ex: "计" },
                { name: "横折弯", char: "㇍", ex: "投" }, { name: "横折弯钩", char: "㇈", ex: "九" },
                { name: "横撇弯钩", char: "㇌", ex: "陈" }, { name: "横折折", char: "㇅", ex: "凹" },
                { name: "横折折撇", char: "㇋", ex: "及" }, { name: "竖折折", char: "㇞", ex: "鼎" },
                { name: "竖折折钩", char: "㇉", ex: "弓" }, { name: "横折折折", char: "㇎", ex: "凸" },
                { name: "横折折折钩", char: "㇡", ex: "乃" }
            ]
        };

        // 全局缓存：存储汉字笔顺数据（来自 Hanzi Writer 数据库）
        const hanziDataCache = new Map();
        // 存储用户手动导入的笔画轨迹
        let loadedPaths = {};

        function updateGridSize() {
            const size = document.getElementById('optGridSize').value;
            document.documentElement.style.setProperty('--grid-size', size);
            generate();
        }

        function initControls() {
            renderGroup('group-basic', strokeData.basic);
            renderGroup('group-hook', strokeData.hook);
            renderGroup('group-complex', strokeData.complex);
            
            const saved = localStorage.getItem('strokePathsConfig');
            if (saved) {
                try {
                    loadedPaths = JSON.parse(saved);
                } catch(e) { console.error("配置加载失败", e); }
            }
        }

        function renderGroup(id, list) {
            const container = document.getElementById(id);
            list.forEach(s => {
                const btn = document.createElement('div');
                btn.className = 'stroke-btn';
                btn.innerHTML = `<span class="s-char">${s.char}</span><span class="s-name">${s.name}</span>`;
                btn.onclick = () => addStroke(s.char, s.ex);
                container.appendChild(btn);
            });
        }

        function addStroke(char, ex) {
            const input = document.getElementById('mode1Input');
            const val = input.value;
            const prefix = (val === '' || val.endsWith('\n')) ? '' : '\n';
            input.value += `${prefix}${char},${ex}`;
            generate();
        }

        // --- 异步获取汉字笔顺数据 (支持 CDN + 本地缓存) ---
        async function fetchHanziData(char) {
            if (!char || char.trim() === '') return null;
            if (hanziDataCache.has(char)) {
                return hanziDataCache.get(char);
            }

            const localKey = `hanzi_data_${char}`;
            const localData = localStorage.getItem(localKey);
            if (localData) {
                try {
                    const parsed = JSON.parse(localData);
                    hanziDataCache.set(char, parsed);
                    return parsed;
                } catch(e){}
            }

            try {
                const url = `https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${encodeURIComponent(char)}.json`;
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                hanziDataCache.set(char, data);
                try {
                    localStorage.setItem(localKey, JSON.stringify(data));
                } catch(e){}
                return data;
            } catch (err) {
                console.warn(`无法加载汉字 [${char}] 的笔顺数据:`, err);
                return null;
            }
        }

        // --- 核心：创建格子 ---
        function createBox(text, type, options = {}) {
            const box = document.createElement('div');
            box.className = 'tianzige';

            const { isGuide = false, isStrokeGuide = false } = options;

            if (text && text.trim()) {
                if (isGuide && document.getElementById('optShowStrokeNumber').checked) {
                    box.setAttribute('data-hanzi-guide', text);
                    renderAsyncHanziGuide(box, text);
                } 
                else if (isStrokeGuide && loadedPaths[text]) {
                    renderStrokeGuideCanvas(box, loadedPaths[text]);
                    const span = document.createElement('span');
                    span.className = `char ${type}`;
                    span.textContent = text;
                    box.appendChild(span);
                } 
                else {
                    const span = document.createElement('span');
                    span.className = `char ${type}`;
                    span.textContent = text;
                    box.appendChild(span);
                }
            }
            return box;
        }

        // --- 渲染汉字笔画及超清晰笔顺数字 (矢量 SVG) ---
        async function renderAsyncHanziGuide(container, char) {
            const data = await fetchHanziData(char);
            
            if (!data || !data.strokes || !data.medians) {
                if (!container.querySelector('.char')) {
                    const span = document.createElement('span');
                    span.className = 'char black';
                    span.textContent = char;
                    container.appendChild(span);
                }
                return;
            }

            container.innerHTML = '';

            const numStyle = document.getElementById('optNumberStyle').value; 
            const charTone = document.getElementById('optCharTone').value;   
            const sizeOption = document.getElementById('optNumberSize').value; 

            let radius = 80;
            let fontSize = 100;
            let strokeWidth = 8;
            let haloWidth = 14; 

            if (sizeOption === 'small') {
                radius = 60;
                fontSize = 76;
                strokeWidth = 6;
                haloWidth = 10;
            } else if (sizeOption === 'medium') {
                radius = 75;
                fontSize = 92;
                strokeWidth = 7;
                haloWidth = 12;
            } else if (sizeOption === 'large') {
                radius = 90;
                fontSize = 112;
                strokeWidth = 9;
                haloWidth = 16;
            } else if (sizeOption === 'xlarge') {
                radius = 105;
                fontSize = 130;
                strokeWidth = 11;
                haloWidth = 20;
            }

            const isPlainNumber = (numStyle === 'plain-black' || numStyle === 'plain-red');

            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'stroke-svg');
            svg.setAttribute('viewBox', '0 0 1024 1024');

            // 1. 绘制汉字所有笔画矢量底字
            let strokeColor = '#888888';
            if (charTone === 'light') strokeColor = '#cccccc';
            else if (charTone === 'black') strokeColor = '#1a1a1a';

            const gStrokes = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            gStrokes.setAttribute('transform', 'translate(0, 900) scale(1, -1)');
            
            data.strokes.forEach((pathStr) => {
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', pathStr);
                path.setAttribute('fill', strokeColor);
                gStrokes.appendChild(path);
            });
            svg.appendChild(gStrokes);

            // 2. 绘制各笔画起笔处的数字序号标号
            const gNumbers = document.createElementNS('http://www.w3.org/2000/svg', 'g');

            let circleFill = '#e74c3c';
            let circleBorder = '#ffffff';
            let textColor = '#ffffff';

            if (numStyle === 'blue') {
                circleFill = '#2471a3';
                circleBorder = '#ffffff';
                textColor = '#ffffff';
            } else if (numStyle === 'black-circle') {
                circleFill = '#ffffff';
                circleBorder = '#111111';
                textColor = '#111111';
            } else if (numStyle === 'plain-black') {
                textColor = '#000000';
            } else if (numStyle === 'plain-red') {
                textColor = '#d81e06';
            }

            // 计算所有点并进行智能轻微防重叠（Collision Avoidance）
            const points = [];
            data.medians.forEach((median, idx) => {
                if (!median || median.length === 0) return;
                const startPoint = median[0];
                let x = startPoint[0];
                let y = 900 - startPoint[1];

                const padding = radius + strokeWidth + 15;
                x = Math.max(padding, Math.min(1024 - padding, x));
                y = Math.max(padding, Math.min(1024 - padding, y));

                for (let prev of points) {
                    const dx = x - prev.x;
                    const dy = y - prev.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const minDist = isPlainNumber ? (fontSize * 0.9) : (radius * 1.5);
                    if (dist < minDist && dist > 0) {
                        const angle = Math.atan2(dy, dx);
                        const push = (minDist - dist) / 2;
                        x += Math.cos(angle) * push;
                        y += Math.sin(angle) * push;
                    }
                }

                points.push({ x, y, num: idx + 1 });
            });

            points.forEach((p) => {
                const numGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                numGroup.setAttribute('transform', `translate(${p.x}, ${p.y})`);

                if (!isPlainNumber) {
                    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
                    circle.setAttribute('r', radius);
                    circle.setAttribute('fill', circleFill);
                    circle.setAttribute('stroke', circleBorder);
                    circle.setAttribute('stroke-width', strokeWidth);
                    numGroup.appendChild(circle);
                }

                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                text.textContent = p.num.toString();
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'central');
                text.setAttribute('fill', textColor);
                text.setAttribute('font-size', (p.num >= 10) ? Math.round(fontSize * 0.82) : fontSize);
                text.setAttribute('font-weight', '900');
                text.setAttribute('font-family', '-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif');

                if (isPlainNumber) {
                    text.setAttribute('stroke', '#ffffff');
                    text.setAttribute('stroke-width', haloWidth);
                    text.setAttribute('stroke-linejoin', 'round');
                    text.setAttribute('paint-order', 'stroke fill');
                }

                numGroup.appendChild(text);
                gNumbers.appendChild(numGroup);
            });

            svg.appendChild(gNumbers);
            container.appendChild(svg);
        }

        // --- 单笔画红线轨迹与起笔圆点 ---
        function renderStrokeGuideCanvas(container, points) {
            const canvas = document.createElement('canvas');
            canvas.className = 'stroke-canvas';
            const size = 150; 
            canvas.width = size; 
            canvas.height = size;
            container.appendChild(canvas);

            const ctx = canvas.getContext('2d');
            const lw = 4;

            ctx.beginPath();
            ctx.strokeStyle = '#e74c3c';
            ctx.lineWidth = lw;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            points.forEach((p, i) => {
                const x = p[0] * size;
                const y = p[1] * size;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            if (points.length > 0) {
                const start = points[0];
                const sx = start[0] * size;
                const sy = start[1] * size;

                ctx.beginPath();
                ctx.arc(sx, sy, 2 * lw, 0, Math.PI * 2);
                ctx.fillStyle = '#e74c3c';
                ctx.fill();
            }
        }

        // --- 配置模态框控制 ---
        function openConfig() { document.getElementById('configModal').style.display = 'flex'; }
        function closeConfig() { document.getElementById('configModal').style.display = 'none'; }
        
        function saveConfig() {
            let input = document.getElementById('configInput').value.trim();
            if (!input) return;

            input = input.replace(/const\s+\w+\s*=\s*/, '').replace(/;$/, '');

            try {
                const json = JSON.parse(input);
                loadedPaths = json;
                localStorage.setItem('strokePathsConfig', JSON.stringify(json));
                alert('配置保存成功！');
                closeConfig();
                generate();
            } catch (e) {
                alert('数据格式错误，请确保粘贴的是正确的 JSON 内容。\n' + e.message);
            }
        }

        // --- 核心：排版生成字帖 ---
        function generate() {
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = '';
            
            const createNewPage = () => {
                const p = document.createElement('div');
                p.className = 'page';
                p.innerHTML = `
                    <div class="header">
                        <div>姓名：__________</div>
                        <div>日期：__________</div>
                        <div>评分：☆☆☆☆☆</div>
                    </div>`;
                return p;
            };

            let currentPage = createNewPage();
            printArea.appendChild(currentPage);
            let rows = 0;
            
            const currentGridSize = document.getElementById('optGridSize').value;
            const layoutMode = document.getElementById('optLayoutMode').value;

            let limit = 13;
            if (currentGridSize === '17mm') limit = 11;
            else if (currentGridSize === '20mm') limit = 10;

            // --- 模式 1：笔画 + 范字 ---
            const m1Text = document.getElementById('mode1Input').value;
            m1Text.split('\n').forEach(line => {
                if (!line.trim()) return;
                const parts = line.replace('，', ',').split(',');
                if (parts.length < 2) return;

                if (rows >= limit) {
                    currentPage = createNewPage();
                    printArea.appendChild(currentPage);
                    rows = 0;
                }

                const strokeChar = parts[0].trim();
                const exampleWord = parts[1].trim()[0] || '';
                
                const div = document.createElement('div');
                div.className = 'row';
                
                div.appendChild(createBox(strokeChar, 'black', { isStrokeGuide: true }));
                
                if (layoutMode === 'semi') {
                    // 半引导：1笔画描红 + 2空白 + 1范字描红 + 1范字空白 + 1范字描红 + 2空白
                    div.appendChild(createBox(strokeChar, 'trace'));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox(exampleWord, 'trace'));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox(exampleWord, 'trace'));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox('', ''));
                } else {
                    for (let i = 0; i < 5; i++) div.appendChild(createBox(strokeChar, 'trace'));
                    for (let i = 0; i < 3; i++) div.appendChild(createBox(exampleWord, 'trace'));
                }
                
                currentPage.appendChild(div);
                rows++;
            });

            // --- 模式 2：整字练习 (首字自动标注笔画顺序) ---
            const m2Text = document.getElementById('mode2Input').value;
            const chars = m2Text.split('').filter(c => c.trim());
            chars.forEach(c => {
                if (rows >= limit) {
                    currentPage = createNewPage();
                    printArea.appendChild(currentPage);
                    rows = 0;
                }
                const div = document.createElement('div');
                div.className = 'row';
                
                // 1. 首字引导格（示范字 + 笔画顺序数字）
                div.appendChild(createBox(c, 'black', { isGuide: true }));
                
                // 2. 后续练习格排版
                if (layoutMode === 'semi') {
                    // 【半引导】：1个描红 + 3个空白 + 1个描红 + 3个空白 (刚好8格)
                    div.appendChild(createBox(c, 'trace'));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox(c, 'trace'));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox('', ''));
                    div.appendChild(createBox('', ''));
                } else if (layoutMode === 'half') {
                    // 半红半空：4描红 + 4空白
                    for (let i = 0; i < 4; i++) div.appendChild(createBox(c, 'trace'));
                    for (let i = 0; i < 4; i++) div.appendChild(createBox('', ''));
                } else if (layoutMode === 'blank') {
                    // 自写模式：8个纯空白格
                    for (let i = 0; i < 8; i++) div.appendChild(createBox('', ''));
                } else {
                    // 全描红模式：8个描红格
                    for (let i = 0; i < 8; i++) div.appendChild(createBox(c, 'trace'));
                }

                currentPage.appendChild(div);
                rows++;
            });
        }

        window.onload = () => {
            initControls();
            generate();
        };
    </script>
</body>
