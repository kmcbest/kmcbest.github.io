<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFTF 角色数值与技能中枢 (Transformers Forged to Fight)</title>
    <style>
        @font-face {
            font-family: 'TecnicaBold';
            src: url('./fonts/Tecnica_Bold_116.ttf'), url('./Tecnica_Bold_116.ttf') format('truetype');
        }

        :root {
            --bg-main: #0B0E14;
            --bg-card: #151A23;
            --bg-card-hover: #1E2532;
            --bg-darker: #080A0F;
            --border-color: #262F40;
            --text-main: #F1F5F9;
            --text-muted: #94A3B8;
            --text-sub: #64748B;
            --primary: #3B82F6;
            --primary-glow: rgba(59, 130, 246, 0.25);
            --tact-color: #0543EF;
            --braw-color: #7D34BC;
            --warr-color: #E9312D;
            --scou-color: #1D9F06;
            --tech-color: #09BCDD;
            --demo-color: #F5BD0D;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            padding-bottom: 80px;
        }

        .tecnica-icon {
            font-family: 'TecnicaBold', sans-serif !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-style: normal;
            line-height: 1;
            vertical-align: middle;
        }

        /* Top Navigation Header */
        header {
            background: linear-gradient(180deg, #131822 0%, #0B0E14 100%);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 16px 32px;
            backdrop-filter: blur(10px);
        }

        .header-container {
            max-width: 1440px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-title {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: linear-gradient(90deg, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-badge {
            background: rgba(59, 130, 246, 0.15);
            color: #60A5FA;
            border: 1px solid rgba(59, 130, 246, 0.3);
            font-size: 11px;
            padding: 2px 8px;
            border-radius: 999px;
            font-weight: 600;
        }

        /* Search & Filters */
        .controls-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-box {
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            width: 240px;
            outline: none;
            transition: all 0.2s;
        }

        .search-box:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-glow);
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }

        .filter-btn:hover {
            color: var(--text-main);
            background: var(--bg-card-hover);
        }

        .filter-btn.active {
            background: var(--primary);
            color: #FFF;
            border-color: var(--primary);
        }

        /* Main Container */
        main {
            max-width: 1440px;
            margin: 24px auto;
            padding: 0 32px;
        }

        /* Stats Overview Cards */
        .stats-overview {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .overview-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .overview-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .overview-value {
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
        }

        /* Class Section */
        .class-section {
            margin-bottom: 40px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
        }

        .class-header {
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            background: linear-gradient(90deg, rgba(255,255,255,0.02) 0%, transparent 100%);
        }

        .class-title-group {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .pua-icon-badge {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .pua-icon-badge:hover {
            border-color: var(--primary);
            box-shadow: 0 0 12px var(--primary-glow);
            transform: scale(1.05);
        }

        .pua-icon-badge .pua-tooltip {
            position: absolute;
            bottom: -28px;
            left: 50%;
            transform: translateX(-50%);
            background: #000;
            color: #FFF;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 10;
        }

        .pua-icon-badge:hover .pua-tooltip {
            opacity: 1;
        }

        .class-name {
            font-size: 18px;
            font-weight: 700;
        }

        .class-en-name {
            font-size: 13px;
            color: var(--text-sub);
            margin-left: 6px;
            font-weight: 500;
        }

        .class-stats-pill {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 500;
        }

        .pill-stat {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pill-stat span.val {
            font-weight: 700;
            color: #38BDF8;
        }

        .class-trait {
            padding: 8px 24px;
            background: rgba(0, 0, 0, 0.2);
            font-size: 12px;
            color: var(--text-muted);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        /* Character Grid */
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 16px;
            padding: 20px 24px;
        }

        .character-card {
            background: var(--bg-darker);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: all 0.2s;
            position: relative;
        }

        .character-card:hover {
            border-color: rgba(59, 130, 246, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }

        .card-faction-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            opacity: 0.85;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid transparent;
        }

        .card-faction-badge:hover {
            opacity: 1;
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .faction-emblem-glyph {
            font-size: 26px;
            line-height: 1;
            color: #94A3B8; /* 游戏中派系标志专用的浅灰色 */
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.6));
            transition: all 0.2s;
        }

        .character-card:hover .faction-emblem-glyph {
            color: #E2E8F0;
        }

        .badge-edit-hint {
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 11px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.6);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transform: scale(0.6);
            transition: all 0.2s;
            color: #38BDF8;
            pointer-events: none;
        }

        .card-faction-badge:hover .badge-edit-hint {
            opacity: 1;
            transform: scale(1);
        }

        .character-card.card-editing {
            border-color: #38BDF8 !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35) !important;
            background: rgba(15, 23, 42, 0.98);
        }

        .card-faction-badge.editing-active {
            opacity: 1 !important;
            background: rgba(16, 185, 129, 0.25) !important;
            border: 1.5px solid #10B981 !important;
            box-shadow: 0 0 12px rgba(16, 185, 129, 0.5) !important;
            animation: pulse-edit-badge 1.8s infinite;
        }

        .badge-save-glyph {
            font-size: 20px;
            line-height: 1;
            filter: drop-shadow(0 0 4px rgba(16, 185, 129, 0.8));
        }

        @keyframes pulse-edit-badge {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); }
            70% { box-shadow: 0 0 0 7px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .card-stat-input {
            width: 100%;
            box-sizing: border-box;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 4px;
            padding: 3px 2px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            color: #F8FAFC;
            outline: none;
            transition: all 0.2s;
            margin-top: 1px;
        }

        .card-stat-input:focus {
            border-color: #38BDF8;
            background: rgba(15, 23, 42, 1);
            box-shadow: 0 0 6px rgba(56, 189, 248, 0.6);
        }

        .card-stat-input::-webkit-outer-spin-button,
        .card-stat-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .card-stat-input[type=number] {
            -moz-appearance: textfield;
        }

        .card-edit-tip {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 10px;
            color: #38BDF8;
            background: rgba(56, 189, 248, 0.08);
            border-radius: 4px;
            padding: 4px 6px;
            margin-top: 6px;
            letter-spacing: 0.2px;
            animation: fadeIn 0.2s ease-in;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .edit-pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
            box-shadow: 0 0 6px #10B981;
            animation: blink-dot 1s infinite alternate;
            flex-shrink: 0;
        }

        @keyframes blink-dot {
            from { opacity: 0.3; }
            to { opacity: 1; }
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-frame {
            width: 58px;
            height: 58px;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: #000;
            flex-shrink: 0;
            position: relative;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-info {
            flex: 1;
            min-width: 0;
            padding-right: 36px;
        }

        .char-names {
            display: flex;
            align-items: baseline;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .name-zh {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-main);
        }

        .name-en {
            font-size: 12px;
            color: var(--text-sub);
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .char-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
        }

        .faction-tag {
            font-size: 11px;
            padding: 1px 6px;
            border-radius: 4px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .source-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            letter-spacing: 0.3px;
            line-height: 1.4;
            display: inline-flex;
            align-items: center;
        }

        .source-kabam {
            background: rgba(245, 158, 11, 0.15);
            color: #FBBF24;
            border: 1px solid rgba(245, 158, 11, 0.35);
        }

        .source-netflix {
            background: rgba(229, 9, 20, 0.2);
            color: #FF4D61;
            border: 1px solid rgba(229, 9, 20, 0.5);
            font-weight: 800;
        }

        .source-revival {
            background: rgba(6, 182, 212, 0.16);
            color: #22D3EE;
            border: 1px solid rgba(34, 211, 238, 0.4);
            box-shadow: 0 0 6px rgba(34, 211, 238, 0.15);
        }

        .origin-tag {
            font-size: 11px;
            color: var(--text-sub);
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.25);
            padding: 2px 4px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Stats Container & Rows */
        .card-stats-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: 8px;
            padding: 8px 6px;
            font-size: 12px;
        }

        .card-stats-row-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .card-stats-row-bottom {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 2px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-item .lbl {
            font-size: 10px;
            color: var(--text-sub);
            text-transform: uppercase;
        }

        .stat-item .num {
            font-weight: 700;
            color: var(--text-main);
            margin-top: 1px;
        }

        .stat-item .num.highlight {
            color: #38BDF8;
        }

        .stat-item .num.custom-override {
            color: #F59E0B;
        }

        /* Card Actions */
        .card-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: auto;
        }

        .btn-view-skills {
            flex: 1;
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(59, 130, 246, 0.3);
            color: #60A5FA;
            padding: 7px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-view-skills:hover {
            background: var(--primary);
            color: #FFF;
        }

        .btn-view-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 31px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #38BDF8;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .btn-view-card:hover {
            background: rgba(56, 189, 248, 0.25);
            border-color: #38BDF8;
            color: #FFF;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            transform: translateY(-1px);
        }

        .tecnica {
            font-family: 'TecnicaBold', sans-serif !important;
            letter-spacing: 0.04em;
        }

        /* Card Dossier Modal */
        .card-dossier-modal-content {
            max-width: 900px;
            width: 95%;
            max-height: 94vh;
            display: flex;
            flex-direction: column;
            background: #060b14;
            border: 1px solid rgba(0, 240, 255, 0.35);
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.2), 0 25px 60px rgba(0,0,0,0.9);
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
        }

        .card-dossier-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: rgba(10, 19, 34, 0.95);
            border-bottom: 1px solid rgba(0, 240, 255, 0.2);
            flex-shrink: 0;
        }

        .card-view-mode-toggle {
            display: flex;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 8px;
            padding: 2px;
            gap: 2px;
        }

        .mode-toggle-btn {
            display: flex;
            align-items: center;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 12px;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-toggle-btn:hover {
            color: #FFF;
        }

        .mode-toggle-btn.active {
            background: rgba(0, 240, 255, 0.2);
            color: #00F0FF;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.25);
        }

        .card-dossier-scroll-body {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: radial-gradient(circle at 50% 10%, #0a1424 0%, #03060c 100%);
        }

        .dossier-poster {
            position: relative;
            background: linear-gradient(180deg, #091220 0%, #050a14 50%, #03060c 100%);
            border: 1px solid rgba(0, 240, 255, 0.25);
            border-radius: 18px;
            padding: 24px;
            box-shadow: inset 0 0 30px rgba(0, 240, 255, 0.04);
        }

        .dossier-grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(0, 240, 255, 0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            pointer-events: none;
            border-radius: 18px;
        }

        .dossier-sec-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 14px;
            background: linear-gradient(90deg, rgba(0, 240, 255, 0.15) 0%, rgba(0, 114, 255, 0.04) 75%, transparent 100%);
            border-left: 4px solid #00F0FF;
            border-radius: 0 8px 8px 0;
            margin: 20px 0 12px 0;
        }

        .dossier-var-pill {
            background: rgba(0, 240, 255, 0.12);
            border: 1px solid rgba(0, 240, 255, 0.35);
            color: #38bdf8;
            padding: 1px 6px;
            border-radius: 4px;
            font-family: 'TecnicaBold', monospace;
            font-size: 11px;
            display: inline-block;
            vertical-align: middle;
            margin: 0 2px;
        }

        .dossier-tab-btn {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dossier-tab-btn:hover {
            color: #FFF;
            border-color: rgba(0, 240, 255, 0.4);
        }

        .dossier-tab-btn.active {
            background: linear-gradient(180deg, rgba(0, 240, 255, 0.25) 0%, rgba(0, 114, 255, 0.1) 100%);
            border-color: #00F0FF;
            color: #FFF;
            box-shadow: 0 0 14px rgba(0, 240, 255, 0.3);
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            width: 90%;
            max-width: 960px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            transform: scale(0.96);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            padding: 20px 28px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-darker);
        }

        .modal-body {
            padding: 24px 28px;
            overflow-y: auto;
            flex: 1;
        }

            opacity: 1;
        }

</head>

    <script>

        // ==========================================
        // Upstash KV Online Storage Client & Fallback
        // ==========================================
        const UPSTASH = {
            url: "https://deciding-bulldog-136761.upstash.io",
            token: "gQAAAAAAAhY5AAIgcDEyZGMwZDRhNzRlZGQ0MDI2YWM2YmI3ZDExNTc3ZjZmNA",
            readToken: "ggAAAAAAAhY5AAIgcDG7a511dMnvUap5JjML7kdCMH0hQAG95-3BtwD6YEaFeQ"
        };

        async function kvGet(key, fallbackPath) {
            try {
                const res = await fetch(`${UPSTASH.url}/get/${encodeURIComponent(key)}`, {
                    headers: { 'Authorization': `Bearer ${UPSTASH.readToken}` }
                });
                if (res.ok) {
                    const json = await res.json();
                    if (json && json.result) {
                        return typeof json.result === 'string' ? JSON.parse(json.result) : json.result;
                    }
                }
            } catch (err) {
                console.warn(`Upstash KV read failed for [${key}], falling back:`, err);
            }
            if (fallbackPath) {
                try {
                    const fbRes = await fetch(fallbackPath);
                    if (fbRes.ok) return await fbRes.json();
                } catch (fbErr) {
                    console.error(`Fallback fetch failed for [${fallbackPath}]:`, fbErr);
                }
            }
            return null;
        }

        async function kvSet(key, value) {
            try {
                const res = await fetch(`${UPSTASH.url}/set/${encodeURIComponent(key)}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${UPSTASH.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(value)
                });
                const json = await res.json();
                return json && json.result === 'OK';
            } catch (err) {
                console.error(`Upstash KV write failed for [${key}]:`, err);
                return false;
            }
        }
    
        let gOverviewData = null;
        let gPuaIcons = [];
        let gCurBotId = null;
        let gCurrentPuaTarget = null;
        let gActiveFactionFilter = 'all';

        // 5 Top-level Ability Sections (with 3 Special Attacks grouped into 1 section)
        const SECTION_DEFS = [
            { type: 'single',        key: 'basic',     name: '基础能力（Abilities）', desc: '常驻基础属性与特性' },
            { type: 'single',        key: 'passive',   name: '被动（Passive）', desc: '战斗中特定条件触发' },
            { type: 'single',        key: 'signature', name: '招牌能力（Signature Ability）', desc: '核心招牌能力' },
            {
                type: 'special_group',
                key: 'special',
                name: '特殊技（Special Attacks）',
                desc: '特殊技能招式',
                subgroups: [
                    { key: 'sp1', name: '特殊技 1 (SP1)', badge: 'SP1', badgeClass: 'sp-badge-1' },
                    { key: 'sp2', name: '特殊技 2 (SP2)', badge: 'SP2', badgeClass: 'sp-badge-2' },
                    { key: 'sp3', name: '特殊技 3 (SP3)', badge: 'SP3', badgeClass: 'sp-badge-3' }
                ]
            },
            { type: 'single',        key: 'synergy',   name: '协同奖励 (Synergy Bonuses)', desc: '同队伍羁绊加成' }
        ];

        // Initialize dashboard
        async function init() {
            try {
                gOverviewData = await kvGet('tftf:overview', './data/overview.json');
                if (gOverviewData && gOverviewData.characters) {
                    gOverviewData.characters.forEach(c => {
                        c.portrait_url = `portraits/${c.bot_id}.png`;
                        c.portrait_large_url = `portraits/${c.bot_id}_large.png`;
                    });
                }

                const puaData = await kvGet('tftf:pua_icons', './data/pua_icons.json');
                gPuaIcons = (puaData && puaData.icons) ? puaData.icons : [];
                document.getElementById('statTotalPua').innerText = `${gPuaIcons.length} 个`;

                renderDashboard();
            } catch (err) {
                console.error("Failed to load dashboard data:", err);
            }
        }

        // Render main summary page grouped by class
        function renderDashboard() {
            if (!gOverviewData) return;

            const container = document.getElementById('classSectionsContainer');
            container.innerHTML = '';

            const classes = gOverviewData.classes;
            const characters = gOverviewData.characters;

            document.getElementById('statTotalBots').innerText = characters.length;
            document.getElementById('statTotalClasses').innerText = `${classes.length} 系`;
            if (gOverviewData.total_abilities) {
                document.getElementById('statTotalAbilities').innerText = `${gOverviewData.total_abilities.toLocaleString()} 条`;
            }

            // Update source filter buttons count
            const kabamCount = characters.filter(b => b.source === 'Kabam').length;
            const netflixCount = characters.filter(b => b.source === 'Netflix').length;
            const revivalCount = characters.filter(b => b.source === 'Revival').length;
            const btnK = document.getElementById('btnSource_Kabam');
            if (btnK) btnK.innerText = `Kabam (${kabamCount})`;
            const btnN = document.getElementById('btnSource_Netflix');
            if (btnN) btnN.innerText = `Netflix (${netflixCount})`;
            const btnR = document.getElementById('btnSource_Revival');
            if (btnR) btnR.innerText = `Revival (${revivalCount})`;

            // Update faction filter buttons with PUA icons and counts
            const sharkCount = characters.filter(b => b.bot_id && b.bot_id.includes('sharkticon')).length;
            const autoCount = characters.filter(b => b.faction === 'autobot').length;
            const decCount = characters.filter(b => b.faction === 'decepticon' && !(b.bot_id && b.bot_id.includes('sharkticon'))).length;
            const predCount = characters.filter(b => b.faction === 'predacon').length;
            const maxCount = characters.filter(b => b.faction === 'maximal').length;

            const factionCounts = {
                autobot: autoCount,
                decepticon: decCount,
                predacon: predCount,
                maximal: maxCount,
            };

            if (gOverviewData.factions) {
                gOverviewData.factions.forEach(f => {
                    const btn = document.getElementById(`btnFilter_${f.faction_id}`);
                    if (btn) {
                        const count = factionCounts[f.faction_id] !== undefined ? ` (${factionCounts[f.faction_id]})` : '';
                        const fPua = f.pua_icon ? `<span class="tecnica-icon" style="margin-right: 4px;">${String.fromCharCode(parseInt(f.pua_icon, 16))}</span>` : '';
                        btn.innerHTML = `${fPua}${f.name_zh}${count}`;
                    }
                });
            }
            const btnShark = document.getElementById('btnFilter_sharkticon');
            if (btnShark) {
                btnShark.innerHTML = `<span class="tecnica-icon" style="margin-right: 4px;">${String.fromCharCode(0xE99E)}</span>饿鲨 (${sharkCount})`;
            }

            classes.forEach(cls => {
                const q = document.getElementById('searchInput').value.trim().toLowerCase();
                const botsInClass = characters.filter(bot => {
                    if (bot.class !== cls.class_id) return false;
                    const isShark = bot.bot_id && bot.bot_id.includes('sharkticon');
                    if (gActiveFactionFilter === 'sharkticon') {
                        if (!isShark) return false;
                    } else if (gActiveFactionFilter === 'decepticon') {
                        if (bot.faction !== 'decepticon' || isShark) return false;
                    } else if (gActiveFactionFilter !== 'all') {
                        if (bot.faction !== gActiveFactionFilter) return false;
                    }
                    if (gActiveSourceFilter !== 'all' && bot.source !== gActiveSourceFilter) return false;
                    if (q) {
                        const matchNameZh = bot.name_zh && bot.name_zh.toLowerCase().includes(q);
                        const matchNameEn = bot.name_en && bot.name_en.toLowerCase().includes(q);
                        const matchBid = bot.bot_id && bot.bot_id.toLowerCase().includes(q);
                        return matchNameZh || matchNameEn || matchBid;
                    }
                    return true;
                });

                // Sort: Kabam regular -> Kabam Sharkticons -> Netflix -> Revival
                botsInClass.sort((a, b) => {
                    const getOrder = (bot) => {
                        const isShark = bot.bot_id && bot.bot_id.includes('shark');
                        if (bot.source === 'Kabam') return isShark ? 1 : 0;
                        if (bot.source === 'Netflix') return 2;
                        if (bot.source === 'Revival') return 3;
                        return 4;
                    };
                    const ordA = getOrder(a);
                    const ordB = getOrder(b);
                    if (ordA !== ordB) return ordA - ordB;
                    return (a.name_zh || a.bot_id).localeCompare(b.name_zh || b.bot_id, 'zh-Hans-CN');
                });

                if (botsInClass.length === 0 && (q || gActiveFactionFilter !== 'all' || gActiveSourceFilter !== 'all')) {
                    return;
                }

                const sec = document.createElement('div');
                sec.className = 'class-section';

                const puaDisplay = cls.pua_icon ? String.fromCharCode(parseInt(cls.pua_icon, 16)) : '⯁';
                const puaTooltipText = cls.pua_icon ? `PUA: ${cls.pua_icon}` : '点击选择PUA职业图标';

                sec.innerHTML = `
                    <div class="class-header" style="border-left: 4px solid ${cls.color_hex};">
                        <div class="class-title-group">
                            <div class="pua-icon-badge" onclick="openPuaPicker('class', '${cls.class_id}', '${cls.pua_icon || ''}')" style="color: ${cls.color_hex};">
                                <span class="tecnica-icon">${puaDisplay}</span>
                                <div class="pua-tooltip">${puaTooltipText}</div>
                            </div>
                            <div>
                                <span class="class-name" style="color: ${cls.color_hex};">${cls.name_zh}</span>
                                <span class="class-en-name">${cls.name_en}</span>
                                <span style="font-size: 12px; color: var(--text-sub); margin-left: 8px;">(${botsInClass.length} 名战士)</span>
                            </div>
                        </div>
                        <div class="class-stats-pill">
                            <div class="pill-stat">基准暴击: <span class="val">${Math.round(cls.crit_chance * 100)}%</span></div>
                            <div class="pill-stat">爆伤: <span class="val">${cls.crit_damage.toFixed(2)}x</span></div>
                            ${cls.ranged_crit_bonus > 0 ? `<div class="pill-stat">远程加成: <span class="val" style="color: #F59E0B;">+${Math.round(cls.ranged_crit_bonus * 100)}%</span></div>` : ''}
                        </div>
                    </div>
                    <div class="class-trait">${cls.trait_zh || '暂无流派描述'}</div>
                    <div class="character-grid" id="grid_${cls.class_id}"></div>
                `;

                container.appendChild(sec);
                const grid = sec.querySelector(`#grid_${cls.class_id}`);

                botsInClass.forEach(bot => {
                    const card = createCharacterCard(bot, cls);
                    grid.appendChild(card);
                });
            });
        }

        const gEditingCardBots = new Set();

        // Create individual character card

                const isMovie = (bot.bot_id && (bot.bot_id.includes('_cin_') || bot.bot_id.includes('_mv_')));
                if (bot.bot_id && bot.bot_id.includes('sharkticon')) facPua = 'E99E';

                else if (bot.faction === 'predacon') facPua = 'E161';

            const isCritOverridden = bot.crit_chance !== null && bot.crit_chance !== undefined;
            const critDisplay = Math.round((bot.effective_crit_chance !== undefined ? bot.effective_crit_chance : 0.15) * 100);
            const isCritDmgOverridden = bot.crit_damage !== null && bot.crit_damage !== undefined;
            const critDmgDisplay = (bot.effective_crit_damage !== undefined ? bot.effective_crit_damage : 1.5).toFixed(2);

            let rangedDisplay = Math.round((bot.effective_crit_ranged !== undefined ? bot.effective_crit_ranged : 0.15) * 100);

            const hpFormatted = (bot.hp !== null && bot.hp !== undefined) ? Number(bot.hp).toLocaleString() : '-';

            } else {

                        <div class="stat-item">

                        </div>
                        <div class="stat-item">
                            <span class="lbl" style="color: #F87171;">攻击力 ATK</span>

                        </div>
                        <div class="stat-item">
                            <span class="lbl" style="color: #FBBF24;">角色评分 PI</span>
                            <input type="number" class="card-stat-input" id="cinput_rat_${bid}" value="${bot.rating !== null && bot.rating !== undefined ? bot.rating : ''}" placeholder="如 11670" style="color: #FBBF24;" title="5星 6/60 角色评分 (Rating)">
                        </div>
                    </div>
                    <div class="card-stats-row-bottom edit-mode">
                        <div class="stat-item">
                            <span class="lbl">暴击率 %</span>
                            <input type="number" step="0.5" class="card-stat-input" id="cinput_crit_${bid}" value="${bot.crit_chance !== null && bot.crit_chance !== undefined ? Math.round(bot.crit_chance * 100) : ''}" placeholder="${critDisplay}%" title="基础暴击率 (留空遵循职业)">

                        </div>
                        <div class="stat-item">
                            <span class="lbl">远程 %</span>
                            <input type="number" step="0.5" class="card-stat-input" id="cinput_crange_${bid}" value="${bot.crit_chance_ranged !== null && bot.crit_chance_ranged !== undefined ? Math.round(bot.crit_chance_ranged * 100) : ''}" placeholder="${rangedDisplay}%" title="远程暴击率">

                    ${isEditing 
                        ? `<span class="badge-save-glyph">💾</span>` 
                        : (facPua ? `<span class="tecnica-icon faction-emblem-glyph">${String.fromCharCode(parseInt(facPua, 16))}</span>` : '')

                    ${!isEditing ? `<span class="badge-edit-hint" title="编辑数值">✎</span>` : ''}
                </div>
                <div class="card-top">
                    <div class="avatar-frame">
                        <img class="avatar-img" src="${bot.portrait_url}" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'58\\' height=\\'58\\'><rect width=\\'100%\\' height=\\'100%\\' fill=\\'%23222\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23666\\' font-size=\\'10\\' text-anchor=\\'middle\\' dy=\\'.3em\\'>TF</text></svg>'">
                    </div>
                    <div class="card-info">
                        <div class="char-names" title="${bot.name_zh} (${bot.name_en})">
                            <span class="name-zh">${bot.name_zh}</span>
                            <span class="name-en">${bot.name_en}</span>
                        </div>
                        <div class="char-meta">
                            <span class="source-tag source-${(bot.source || 'Kabam').toLowerCase()}">${bot.source || 'Kabam'}</span>
                            <span class="faction-tag" style="background: ${factionObj.color_hex}22; color: ${factionObj.color_hex}; border-color: ${factionObj.color_hex}44;" onclick="openPuaPicker('faction', '${bot.faction}', '${facPua}')" title="点击选择 [${factionObj.name_zh}] 阵营通用图标并保存入库">
                                ${facPua ? `<span class="tecnica-icon" style="margin-right: 3px;">${String.fromCharCode(parseInt(facPua, 16))}</span>` : ''}

                            <span class="origin-tag">${bot.origin || 'G1'}</span>

                <div class="card-stats-container">
                    ${statsContentHtml}
                </div>

                <div class="card-actions">
                    <button class="btn-view-skills" onclick="openCharacterModal('${bot.bot_id}')">查看技能与招式</button>
                    <button class="btn-view-card" onclick="openCharacterCardModal('${bot.bot_id}')" title="查看机体全息档案卡 (Card Dossier)">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
                            <line x1="7" y1="8" x2="12" y2="8"></line>
                            <line x1="7" y1="12" x2="12" y2="12"></line>

            if (isEditing) {
                setTimeout(() => {
                    const inputs = card.querySelectorAll('.card-stat-input');
                    inputs.forEach(inp => {
                        inp.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                toggleCardEditMode(bot.bot_id);
                            } else if (e.key === 'Escape') {
                                e.preventDefault();
                                cancelCardEditMode(bot.bot_id);
                            }
                        });
                    });
                }, 0);
            }

            return card;
        }

        // Toggle card edit mode on clicking the top-right faction badge
        async function toggleCardEditMode(botId, event) {
            if (event && event.stopPropagation) {
                event.stopPropagation();
            }
            if (gEditingCardBots.has(botId)) {
                await saveAndExitCardEditMode(botId);
            } else {
                gEditingCardBots.add(botId);
                refreshSingleCard(botId);
            }
        }

        // Cancel card edit mode without saving
        function cancelCardEditMode(botId) {
            gEditingCardBots.delete(botId);
            refreshSingleCard(botId);
            showToast("已取消编辑");
        }

        // Save inline card edit and exit edit mode
        async function saveAndExitCardEditMode(botId) {
            const bot = (gOverviewData && gOverviewData.characters) ? gOverviewData.characters.find(c => c.bot_id === botId) : null;
            if (!bot) return;

            const hpEl = document.getElementById(`cinput_hp_${botId}`);
            const atkEl = document.getElementById(`cinput_atk_${botId}`);
            const ratEl = document.getElementById(`cinput_rat_${botId}`);
            const critEl = document.getElementById(`cinput_crit_${botId}`);
            const cdmgEl = document.getElementById(`cinput_cdmg_${botId}`);
            const crangeEl = document.getElementById(`cinput_crange_${botId}`);
            const cmeleeEl = document.getElementById(`cinput_cmelee_${botId}`);

            if (!hpEl) {
                gEditingCardBots.delete(botId);
                refreshSingleCard(botId);
                return;
            }

            const hpVal = hpEl.value.trim();
            const atkVal = atkEl.value.trim();
            const ratVal = ratEl.value.trim();

            const hp = hpVal !== '' ? parseInt(hpVal, 10) : null;
            const attack = atkVal !== '' ? parseInt(atkVal, 10) : null;
            const rating = ratVal !== '' ? parseInt(ratVal, 10) : null;

            const payload = { hp, attack, rating };

            if (critEl && critEl.value.trim() !== '') {
                payload.crit_chance = parseFloat(critEl.value.trim()) / 100.0;
            }
            if (cdmgEl && cdmgEl.value.trim() !== '') {
                payload.crit_damage = parseFloat(cdmgEl.value.trim());
            }
            if (crangeEl && crangeEl.value.trim() !== '') {
                payload.crit_chance_ranged = parseFloat(crangeEl.value.trim()) / 100.0;
            }
            if (cmeleeEl && cmeleeEl.value.trim() !== '') {
                payload.crit_chance_melee = parseFloat(cmeleeEl.value.trim()) / 100.0;
            }

            try {
                const res = await fetch(`/api/character/${botId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const ret = await res.json();
                if (ret.ok) {
                    bot.hp = hp;
                    bot.attack = attack;
                    bot.rating = rating;
                    if (payload.crit_chance !== undefined) bot.crit_chance = payload.crit_chance;
                    if (payload.crit_damage !== undefined) bot.crit_damage = payload.crit_damage;
                    if (payload.crit_chance_ranged !== undefined) bot.crit_chance_ranged = payload.crit_chance_ranged;
                    if (payload.crit_chance_melee !== undefined) bot.crit_chance_melee = payload.crit_chance_melee;

                    const cDef = (gOverviewData && gOverviewData.classes) ? (gOverviewData.classes.find(c => c.class_id === bot.class) || {}) : {};
                    bot.effective_crit_chance = bot.crit_chance !== null ? bot.crit_chance : (cDef.crit_chance || 0.15);
                    bot.effective_crit_damage = bot.crit_damage !== null ? bot.crit_damage : (cDef.crit_damage || 1.5);
                    bot.effective_crit_ranged = bot.crit_chance_ranged !== null ? bot.crit_chance_ranged : (bot.effective_crit_chance + (cDef.ranged_crit_bonus || 0.0));
                    bot.effective_crit_melee = bot.crit_chance_melee !== null ? bot.crit_chance_melee : bot.effective_crit_chance;

                    gEditingCardBots.delete(botId);
                    refreshSingleCard(botId);
                    showToast(`✓ [${bot.name_zh || bot.name_en}] 属性已保存入库！`);
                } else {
                    alert("保存失败: " + (ret.error || "未知错误"));
                }
            } catch (err) {
                console.error("Save character stats error:", err);
                alert("保存失败，请检查网络或服务器状态");
            }
        }

        // Re-render a single character card in the DOM
        function refreshSingleCard(botId) {
            const oldCard = document.getElementById(`card_${botId}`);
            if (!oldCard) return;
            const bot = (gOverviewData && gOverviewData.characters) ? gOverviewData.characters.find(c => c.bot_id === botId) : null;
            if (!bot) return;

            const newCard = createCharacterCard(bot);
            oldCard.replaceWith(newCard);

            if (gEditingCardBots.has(botId)) {
                setTimeout(() => {
                    const firstInp = document.getElementById(`cinput_hp_${botId}`);
                    if (firstInp) {
                        firstInp.focus();
                        firstInp.select();
                    }
                }, 20);
            }
        }

        let gSynergyPartnersMap = {};

        // Helper: Create single Ability Card element

        function switchDescTab(btn, lang) {
            const parent = btn.closest('.desc-tabs-container');

            buttons.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const taEn = parent.querySelector('.desc-ta-en');
            if (lang === 'zh') {

                if (taEn) taEn.style.display = 'none';

                if (taEn) taEn.style.display = 'block';

                selectEl.className = `ability-status-select status-${newStatus}`;
            }

            const statusNames = {
                'unimplemented': '未实现',
                'partial': '部分实现',
                'implemented': '已实现',
                'ignored': '暂不考虑'
            };

            try {
                const res = await fetch(`/api/ability/${aid}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                const ret = await res.json();
                if (ret.ok) {
                    showToast(`能力状态已更新：${statusNames[newStatus] || newStatus}`);

        async function saveNewSpecialSlot(spKey, spBadge) {
            if (!gCurBotId) return;
            const titleZhInput = document.getElementById(`title_zh_new_${spKey}`) || document.getElementById(`title_new_${spKey}`);
            const titleEnInput = document.getElementById(`title_en_new_${spKey}`);
            const descZhInput = document.getElementById(`desc_zh_new_${spKey}`) || document.getElementById(`desc_new_${spKey}`);
            const descEnInput = document.getElementById(`desc_en_new_${spKey}`);
            const statusSelect = document.getElementById(`status_new_${spKey}`);

            const title_zh = titleZhInput ? titleZhInput.value.trim() : '';
            const title_en = titleEnInput ? titleEnInput.value.trim() : '';
            const desc_zh = descZhInput ? descZhInput.value.trim() : '';
            const desc_en = descEnInput ? descEnInput.value.trim() : '';
            const status = statusSelect ? statusSelect.value : 'unimplemented';
            const pua_icon = gNewSpecialPuaIcons[spKey] || '';

            if (!title_zh && !title_en && !desc_zh && !desc_en) {
                alert(`请先填写特殊技 ${spBadge} 的标题或描述后再保存！`);
                return;
            }

            try {
                const res = await fetch('/api/ability/new', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        bot_id: gCurBotId,
                        category: spKey,
                        title_zh: title_zh || `特殊技 ${spBadge}`,
                        title_en: title_en || `Special Attack ${spBadge}`,
                        desc_zh,
                        desc_en,
                        pua_icon,
                        status
                    })
                });
                const ret = await res.json();
                if (ret.ok) {
                    showToast(`特殊技 ${spBadge} 已保存入库！`);
                    gNewSpecialPuaIcons[spKey] = '';
                    await openCharacterModal(gCurBotId);
                }
            } catch (err) {
                console.error("Failed to save special attack slot:", err);
                alert("保存失败");
            }
        }

        // Render Categorized Abilities into 5 Sections (SP1, SP2, SP3 fixed under Special Attacks)

                    block.innerHTML = `

                        <div class="category-header-bar">

                                <span class="cat-title-text">${secDef.name}</span>

                        </div>

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function closeCharModal() {
            document.getElementById('charModal').classList.remove('active');
        }

        // Save Character Stats
        async function saveCharacterStats() {
            if (!gCurBotId) return;

            const hp_val = document.getElementById('inpHp').value.trim();
            const hp = hp_val !== '' ? parseInt(hp_val, 10) : null;
            const attack_val = document.getElementById('inpAttack').value.trim();
            const attack = attack_val !== '' ? parseInt(attack_val, 10) : null;
            const rating_val = document.getElementById('inpRating').value.trim();
            const rating = rating_val !== '' ? parseInt(rating_val, 10) : null;

            const health_mult = parseFloat(document.getElementById('inpHealthMult').value) || 1.0;
            const attack_mult = parseFloat(document.getElementById('inpAttackMult').value) || 1.0;
            const crit_chance_val = document.getElementById('inpCritChance').value;
            const crit_chance = crit_chance_val !== '' ? parseFloat(crit_chance_val) : null;
            const crit_damage_val = document.getElementById('inpCritDamage').value;
            const crit_damage = crit_damage_val !== '' ? parseFloat(crit_damage_val) : null;
            const crit_ranged_val = document.getElementById('inpCritRanged').value;
            const crit_chance_ranged = crit_ranged_val !== '' ? parseFloat(crit_ranged_val) : null;
            const crit_melee_val = document.getElementById('inpCritMelee').value;
            const crit_chance_melee = crit_melee_val !== '' ? parseFloat(crit_melee_val) : null;
            const block_proficiency = parseFloat(document.getElementById('inpBlockProf').value) || 0.5;

            const payload = {
                hp,
                attack,
                rating,
                health_mult,
                attack_mult,
                crit_chance,
                crit_damage,
                crit_chance_ranged,
                crit_chance_melee,
                block_proficiency
            };

            try {
                const res = await fetch(`/api/character/${gCurBotId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const ret = await res.json();
                if (ret.ok) {
                    showToast("角色数值设定已保存入库！");
                    const ovRes = await fetch('/api/overview');
                    gOverviewData = await ovRes.json();
                    renderDashboard();
                }
            } catch (err) {
                console.error("Save failed:", err);
                alert("保存失败，请检查服务连接");
            }
        }

        // Save individual ability
        async function saveAbilityItem(aid) {
            const titleZhInput = document.getElementById(`title_zh_${aid}`) || document.getElementById(`title_${aid}`);
            const titleEnInput = document.getElementById(`title_en_${aid}`);
            const descZhInput = document.getElementById(`desc_zh_${aid}`) || document.getElementById(`desc_${aid}`);
            const descEnInput = document.getElementById(`desc_en_${aid}`);
            const statusSelect = document.getElementById(`status_${aid}`);

            const title_zh = titleZhInput ? titleZhInput.value.trim() : '';
            const title_en = titleEnInput ? titleEnInput.value.trim() : '';
            const desc_zh = descZhInput ? descZhInput.value.trim() : '';
            const desc_en = descEnInput ? descEnInput.value.trim() : '';
            const status = statusSelect ? statusSelect.value : 'unimplemented';

            const payload = { title_zh, title_en, desc_zh, desc_en, status };
            if (gSynergyPartnersMap[aid] !== undefined) {
                payload.synergy_bots = gSynergyPartnersMap[aid];
            }

            try {
                const res = await fetch(`/api/ability/${aid}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const ret = await res.json();
                if (ret.ok) {
                    showToast("技能已保存！");
                }
            } catch (err) {
                console.error("Failed to save ability:", err);
                alert("保存失败");
            }
        }

        // Delete ability
        async function deleteAbilityItem(aid) {
            if (!confirm("确认删除此项能力？")) return;

            try {
                const res = await fetch(`/api/ability/delete/${aid}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const ret = await res.json();
                if (ret.ok) {
                    showToast("能力已删除");
                    if (gCurBotId) openCharacterModal(gCurBotId);
                }
            } catch (err) {
                console.error("Failed to delete ability:", err);
                alert("删除失败");
            }
        }

        // Synergy Chips Render & Removal
        function renderSynergyChips(aid) {
            const container = document.getElementById(`synergy_chips_${aid}`);
            if (!container) return;
            const partnerIds = gSynergyPartnersMap[aid] || [];
            if (partnerIds.length === 0) {
                container.innerHTML = `<span class="synergy-empty-hint">暂未关联协同人物，点击右上方 [+ 选择协同角色] 进行配置</span>`;
                return;
            }

            container.innerHTML = partnerIds.map(bid => {
                const bObj = (gOverviewData && gOverviewData.characters) ? gOverviewData.characters.find(c => c.bot_id === bid) : null;
                const name = bObj ? (bObj.name_zh || bObj.name_en) : bid;
                const portrait = bObj ? bObj.portrait_url : `/portrait/${bid}`;
                return `
                    <div class="synergy-chip" title="${escapeHtml(name)} (${bid})">
                        <img src="${portrait}" class="synergy-chip-avatar" alt="${escapeHtml(name)}" onerror="this.src='/portrait/${bid}'">
                        <span>${escapeHtml(name)}</span>
                        <span class="synergy-chip-remove" onclick="removeSynergyPartner(${aid}, '${bid}')" title="移除此协同角色">&times;</span>
                    </div>
                `;
            }).join('');
        }

        function removeSynergyPartner(aid, bid) {
            if (!gSynergyPartnersMap[aid]) return;
            gSynergyPartnersMap[aid] = gSynergyPartnersMap[aid].filter(id => id !== bid);
            renderSynergyChips(aid);
            saveAbilityItem(aid);
        }

        function renderNewAbSynergyChips() {
            const container = document.getElementById('newAbSynergyChips');
            if (!container) return;
            if (gNewAbSynergyBots.length === 0) {
                container.innerHTML = `<span class="synergy-empty-hint">暂未关联协同人物</span>`;
                return;
            }
            container.innerHTML = gNewAbSynergyBots.map(bid => {
                const bObj = (gOverviewData && gOverviewData.characters) ? gOverviewData.characters.find(c => c.bot_id === bid) : null;
                const name = bObj ? (bObj.name_zh || bObj.name_en) : bid;
                const portrait = bObj ? bObj.portrait_url : `/portrait/${bid}`;
                return `
                    <div class="synergy-chip" title="${escapeHtml(name)}">
                        <img src="${portrait}" class="synergy-chip-avatar" alt="${escapeHtml(name)}">
                        <span>${escapeHtml(name)}</span>
                        <span class="synergy-chip-remove" onclick="removeNewAbSynergyPartner('${bid}')">&times;</span>
                    </div>
                `;
            }).join('');
        }

        function removeNewAbSynergyPartner(bid) {
            gNewAbSynergyBots = gNewAbSynergyBots.filter(id => id !== bid);
            renderNewAbSynergyChips();
        }

        // Synergy Partner Picker Modal
        function openSynergyPartnerPicker(targetId) {
            gActiveSynergyTargetId = targetId;
            if (targetId === 'new_ability') {
                gTempSelectedSynergyBots = [...gNewAbSynergyBots];
            } else {
                gTempSelectedSynergyBots = gSynergyPartnersMap[targetId] ? [...gSynergyPartnersMap[targetId]] : [];
            }
            gSynergyFilterFaction = 'all';
            gSynergySearchQuery = '';
            document.getElementById('synergySearchInput').value = '';
            document.querySelectorAll('#synergyPickerModal .pua-tab-btn').forEach(btn => btn.classList.remove('active'));
            const firstTab = document.querySelector('#synergyPickerModal .pua-tab-btn');
            if (firstTab) firstTab.classList.add('active');

            renderSynergyPickerGrid();
            document.getElementById('synergyPickerModal').classList.add('active');
        }

        function closeSynergyPickerModal() {
            document.getElementById('synergyPickerModal').classList.remove('active');
            gActiveSynergyTargetId = null;
        }

        function filterSynergyPicker(query) {
            gSynergySearchQuery = (query || '').trim().toLowerCase();
            renderSynergyPickerGrid();
        }

        function filterSynergyFaction(faction, btn) {
            gSynergyFilterFaction = faction;
            document.querySelectorAll('#synergyPickerModal .pua-tab-btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            renderSynergyPickerGrid();
        }

        function renderSynergyPickerGrid() {
            const grid = document.getElementById('synergyPickerGrid');
            if (!grid || !gOverviewData) return;
            grid.innerHTML = '';

            let chars = gOverviewData.characters || [];
            if (gCurBotId) {
                chars = chars.filter(c => c.bot_id !== gCurBotId);
            }

            if (gSynergyFilterFaction !== 'all') {
                chars = chars.filter(c => c.faction === gSynergyFilterFaction);
            }

            if (gSynergySearchQuery) {
                chars = chars.filter(c => {
                    const zh = (c.name_zh || '').toLowerCase();
                    const en = (c.name_en || '').toLowerCase();
                    const bid = (c.bot_id || '').toLowerCase();
                    return zh.includes(gSynergySearchQuery) || en.includes(gSynergySearchQuery) || bid.includes(gSynergySearchQuery);
                });
            }

            chars.forEach(c => {
                const isSelected = gTempSelectedSynergyBots.includes(c.bot_id);
                const item = document.createElement('div');
                item.className = `synergy-picker-item ${isSelected ? 'selected' : ''}`;
                item.onclick = () => toggleSynergyBotSelection(c.bot_id);

                item.innerHTML = `
                    <div class="check-mark">✓</div>
                    <img src="${c.portrait_url}" class="synergy-picker-avatar" alt="${c.name_zh || c.bot_id}" onerror="this.src='/portrait/${c.bot_id}'">
                    <div class="synergy-picker-name">${escapeHtml(c.name_zh || c.name_en)}</div>
                    <div class="synergy-picker-sub">${escapeHtml(c.name_en || '')}</div>
                `;
                grid.appendChild(item);
            });

            const countText = document.getElementById('synergySelectedCountText');
            if (countText) {
                countText.innerText = `已选择 ${gTempSelectedSynergyBots.length} 位角色`;
            }
        }

        function toggleSynergyBotSelection(bid) {
            if (gTempSelectedSynergyBots.includes(bid)) {
                gTempSelectedSynergyBots = gTempSelectedSynergyBots.filter(id => id !== bid);
            } else {
                gTempSelectedSynergyBots.push(bid);
            }
            renderSynergyPickerGrid();
        }

        function clearSynergySelection() {
            gTempSelectedSynergyBots = [];
            renderSynergyPickerGrid();
        }

        function confirmSynergyPartnerSelection() {
            if (gActiveSynergyTargetId === 'new_ability') {
                gNewAbSynergyBots = [...gTempSelectedSynergyBots];
                renderNewAbSynergyChips();
            } else if (gActiveSynergyTargetId) {
                gSynergyPartnersMap[gActiveSynergyTargetId] = [...gTempSelectedSynergyBots];
                renderSynergyChips(gActiveSynergyTargetId);
                saveAbilityItem(gActiveSynergyTargetId);
            }
            closeSynergyPickerModal();
        }

        // Open Add Ability Modal
        function openAddAbilityModal(categoryKey, categoryName) {
            document.getElementById('newAbCategory').value = categoryKey;
            document.getElementById('addAbilityCategoryLabel').innerText = `所属分类: ${categoryName}`;
            document.getElementById('newAbTitle').value = '';
            const titleEnEl = document.getElementById('newAbTitleEn');
            if (titleEnEl) titleEnEl.value = '';
            document.getElementById('newAbDesc').value = '';
            const descEnEl = document.getElementById('newAbDescEn');
            if (descEnEl) descEnEl.value = '';

            // Reset description tab to Chinese
            const nav = document.querySelector('#addAbilityModal .desc-tabs-nav');
            if (nav) {
                nav.querySelectorAll('.desc-tab-btn').forEach((b, idx) => {
                    if (idx === 0) b.classList.add('active');
                    else b.classList.remove('active');
                });
            }
            const taZh = document.getElementById('newAbDesc');
            const taEn = document.getElementById('newAbDescEn');

        // Submit New Ability
        async function submitNewAbility() {
            if (!gCurBotId) return;

            const category = document.getElementById('newAbCategory').value;
            const title_zh = document.getElementById('newAbTitle').value.trim();
            const desc_zh = document.getElementById('newAbDesc').value.trim();
            const pua_icon = document.getElementById('newAbPuaIconVal').value;

            if (!title_zh) {
                alert("请输入能力标题！");
                return;
            }

            const payload = {
                bot_id: gCurBotId,
                category,
                title_zh,
                desc_zh,
                pua_icon
            };

            if (category === 'synergy') {
                payload.synergy_bots = gNewAbSynergyBots;
            }

            try {
                const res = await fetch('/api/ability/new', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const ret = await res.json();
                if (ret.ok) {
                    showToast("新能力创建成功！");
                    closeAddAbilityModal();
                    openCharacterModal(gCurBotId);
                }
            } catch (err) {
                console.error("Failed to create ability:", err);
                alert("创建失败");
            }

        // PUA Picker Modal
        function openPuaPicker(type, targetId, currentHex) {
            gCurrentPuaTarget = { type, targetId, currentHex };
            const desc = document.getElementById('puaTargetDesc');
            if (type === 'ability') {
                desc.innerText = `为能力 ID #${targetId} 选择并保存 PUA 图标至数据库`;
            } else if (type === 'new_ability') {
                desc.innerText = `为新创作能力选择 PUA 图标`;
            } else if (type === 'new_sp') {
                desc.innerText = `为新特殊技 [${targetId.toUpperCase()}] 选择 PUA 图标`;
            } else if (type === 'class') {
                desc.innerText = `为职业 [${targetId}] 选择并保存 PUA 图标至 class_defaults 表`;
            } else if (type === 'faction') {
                desc.innerText = `为阵营 [${targetId}] 选择并保存 PUA 通用图标至 factions 表`;
            } else if (type === 'char_faction') {
                desc.innerText = `为角色 [${targetId}] 专属阵营选择 PUA 图标`;

            document.getElementById('puaModal').classList.remove('active');
            gCurrentPuaTarget = null;

        function renderPuaGrid(icons) {
            const grid = document.getElementById('puaGrid');
            grid.innerHTML = '';

            icons.forEach(icon => {
                const cell = document.createElement('div');
                cell.className = 'pua-cell';
                const char = String.fromCharCode(icon.codepoint_dec);

                cell.innerHTML = `
                    <span class="tecnica-icon pua-glyph">${char}</span>
                    <span class="pua-hex">${icon.codepoint_hex}</span>
                    <span class="pua-name" title="${icon.glyph_name}">${icon.glyph_name}</span>
                `;
                cell.onclick = () => selectPuaIcon(icon);
                grid.appendChild(cell);
            });
        }

        async function selectPuaIcon(icon) {
            if (!gCurrentPuaTarget) return;

            const hex = icon.codepoint_hex;
            const { type, targetId } = gCurrentPuaTarget;

            try {
                if (type === 'ability') {
                    const res = await fetch(`/api/ability/${targetId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pua_icon: hex })
                    });
                    const ret = await res.json();
                    if (ret.ok) {
                        showToast(`技能图标已存入数据库: ${icon.glyph_name} (${hex})`);
                        // Update button immediately in open modal
                        const btn = document.querySelector(`.ability-pua-picker-btn[onclick*="'${targetId}'"]`);
                        if (btn) {
                            const glyphSpan = btn.querySelector('.ability-pua-icon-glyph');
                            const hexSpan = btn.querySelector('.ability-pua-hex-sub');
                            if (glyphSpan) glyphSpan.innerText = String.fromCharCode(icon.codepoint_dec);
                            if (hexSpan) hexSpan.innerText = hex;
                        }
                    }
                } else if (type === 'new_ability') {
                    document.getElementById('newAbPuaIconVal').value = hex;
                    document.getElementById('newAbPuaGlyph').innerText = String.fromCharCode(icon.codepoint_dec);
                    document.getElementById('newAbPuaHex').innerText = hex;
                    showToast(`新技能图标已选用: ${icon.glyph_name} (${hex})`);
                } else if (type === 'new_sp') {
                    gNewSpecialPuaIcons[targetId] = hex;
                    const glyphEl = document.getElementById(`pua_glyph_new_${targetId}`);
                    const hexEl = document.getElementById(`pua_hex_new_${targetId}`);
                    if (glyphEl) glyphEl.innerText = String.fromCharCode(icon.codepoint_dec);
                    if (hexEl) hexEl.innerText = hex;
                    showToast(`特殊技图标已选用: ${icon.glyph_name} (${hex})`);
                } else if (type === 'class') {
                    const res = await fetch(`/api/class/${targetId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pua_icon: hex })
                    });
                    const ret = await res.json();
                    if (ret.ok) {
                        showToast(`职业 [${targetId}] 图标已存入数据库: ${icon.glyph_name} (${hex})`);
                        const ovRes = await fetch('/api/overview');
                        gOverviewData = await ovRes.json();
                        renderDashboard();
                        if (gCurBotId) openCharacterModal(gCurBotId);
                    }
                } else if (type === 'faction') {
                    const res = await fetch(`/api/faction/${targetId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pua_icon: hex })
                    });
                    const ret = await res.json();
                    if (ret.ok) {
                        showToast(`阵营 [${targetId}] 图标已存入数据库: ${icon.glyph_name} (${hex})`);
                        const ovRes = await fetch('/api/overview');
                        gOverviewData = await ovRes.json();
                        renderDashboard();
                        if (gCurBotId) openCharacterModal(gCurBotId);
                    }
                } else if (type === 'char_faction') {
                    const res = await fetch(`/api/character/${targetId}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pua_faction_icon: hex })
                    });
                    const ret = await res.json();
                    if (ret.ok) {
                        showToast(`角色阵营图标已存入数据库: ${icon.glyph_name} (${hex})`);
                        const ovRes = await fetch('/api/overview');
                        gOverviewData = await ovRes.json();
                        renderDashboard();
                        if (gCurBotId) openCharacterModal(gCurBotId);
                    }
                }

                closePuaModal();
            } catch (err) {
                console.error("Failed to save PUA icon:", err);
                alert("保存失败，请检查服务连接");
            }
        }

            const q = document.getElementById('puaSearchInput').value.trim().toLowerCase();
            const filtered = gPuaIcons.filter(ic => {

                if (q) {

                return true;

            renderPuaGrid(filtered);
