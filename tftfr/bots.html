                        <span class="tecnica" style="font-size:10px;font-weight:700;background:rgba(245,158,11,0.2);color:#fde047;padding:1px 6px;border-radius:4px;border:1px solid rgba(245,158,11,0.4);">SIGNATURE</span>
                    </div>
                    <div style="font-size:12px;color:#e2e8f0;line-height:1.6;">${fmtDossierDesc(s.desc_zh)}</div>
                </div>
            `).join('') : '<div style="font-size:12px;color:#64748b;font-style:italic;">暂无招牌能力配置</div>';

            // Left Col Basic Card HTML
            const basicCardHtml = `
                <div style="background:rgba(15,23,42,0.5);border:1px solid rgba(0,240,255,0.2);border-radius:12px;padding:14px;">
                    <div class="tecnica" style="font-size:11px;font-weight:700;color:#00F0FF;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #1e293b;padding-bottom:6px;">
                        <span style="width:6px;height:6px;border-radius:50%;background:#00F0FF;"></span> 基础能力 (BASIC ABILITIES)
                    </div>
                    ${basicAbs.length ? basicAbs.map((b, idx) => `
                        <div style="${idx > 0 ? 'padding-top:10px;margin-top:10px;border-top:1px solid rgba(255,255,255,0.06);' : ''}">
                            <div style="display:flex;justify-content:space-between;align-items:baseline;">
                                <span style="font-size:13px;font-weight:700;color:#FFF;">${b.title_zh || '基础能力'}</span>
                                <span class="tecnica" style="font-size:10px;color:#38bdf8;">${b.title_en || ''}</span>
                            </div>
                            <div style="font-size:12px;color:#94a3b8;margin-top:4px;line-height:1.5;">${fmtDossierDesc(b.desc_zh)}</div>
                        </div>
                    `).join('') : '<div style="font-size:12px;color:#64748b;">暂无基础能力</div>'}
                </div>
            `;

            // Right Col Passives Card HTML
            const passiveCardHtml = `
                <div style="background:rgba(15,23,42,0.5);border:1px solid rgba(34,197,94,0.25);border-radius:12px;padding:14px;">
                    <div class="tecnica" style="font-size:11px;font-weight:700;color:#4ade80;letter-spacing:1px;margin-bottom:10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #1e293b;padding-bottom:6px;">
                        <span style="width:6px;height:6px;border-radius:50%;background:#4ade80;"></span> 被动战技 (PASSIVE ABILITIES)
                    </div>
                    ${passiveAbs.length ? passiveAbs.map((p, idx) => `
                        <div style="${idx > 0 ? 'padding-top:10px;margin-top:10px;border-top:1px solid rgba(255,255,255,0.06);' : ''}">
                            <div style="display:flex;justify-content:space-between;align-items:baseline;">
                                <span style="font-size:13px;font-weight:700;color:#FFF;">${p.title_zh || '被动战技'}</span>
                                <span class="tecnica" style="font-size:10px;color:#4ade80;">${p.title_en || ''}</span>
                            </div>
                            <div style="font-size:12px;color:#94a3b8;margin-top:4px;line-height:1.5;">${fmtDossierDesc(p.desc_zh)}</div>
                        </div>
                    `).join('') : '<div style="font-size:12px;color:#64748b;">暂无被动战技</div>'}
                </div>
            `;

            // Section 3: Basic & Passives for Long Mode
            const basicPassHtml = `
                <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:14px;align-items:start;">
                    ${basicCardHtml}
                    ${passiveCardHtml}
                </div>
            `;

            // Section 3: Basic & Passives + Signature for Tab Mode (Signature moved under Basic to save vertical space!)
            const basicPassTabHtml = `
                <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:14px;align-items:start;">
                    <div style="display:flex;flex-direction:column;gap:14px;">
                        ${basicCardHtml}
                        ${sigAbs.length ? sigAbs.map(s => `
                            <div style="background:linear-gradient(90deg, rgba(245,158,11,0.15) 0%, rgba(15,23,42,0.6) 100%);border-left:4px solid #f59e0b;border-radius:0 10px 10px 0;padding:14px 16px;border-top:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);border-right:1px solid rgba(255,255,255,0.06);">
                                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;">
                                    <div style="display:flex;align-items:center;gap:8px;">
                                        <span style="font-size:14px;font-weight:700;color:#FFF;">${s.title_zh || '觉醒能力'}</span>
                                        <span class="tecnica" style="font-size:11px;color:#f59e0b;">${s.title_en || ''}</span>
                                    </div>
                                    <span class="tecnica" style="font-size:10px;font-weight:700;background:rgba(245,158,11,0.2);color:#fde047;padding:1px 6px;border-radius:4px;border:1px solid rgba(245,158,11,0.4);">SIGNATURE</span>
                                </div>
                                <div style="font-size:12px;color:#e2e8f0;line-height:1.6;">${fmtDossierDesc(s.desc_zh)}</div>
                            </div>
                        `).join('') : ''}
                    </div>
                    ${passiveCardHtml}
                </div>
            `;


            // Section 4: Specials (SP1, SP2, SP3)
            const spContentHtml = spAbs.length ? spAbs.map((sp, idx) => {
                const spTag = sp.category.toUpperCase();
                const cost = sp.category === 'sp1' ? '1 BAR POWER' : (sp.category === 'sp2' ? '2 BARS POWER' : 'MAX 3 BARS');
                const badgeColor = sp.category === 'sp3' ? '#a855f7' : (sp.category === 'sp2' ? '#3b82f6' : '#00F0FF');
                return `
                    <div style="background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 16px;margin-bottom:8px;">
                        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span class="tecnica" style="font-size:11px;font-weight:900;background:${badgeColor}22;color:${badgeColor};border:1px solid ${badgeColor}55;padding:1px 6px;border-radius:4px;">${spTag}</span>
                                <span style="font-size:13px;font-weight:700;color:#FFF;">${sp.title_zh || '特殊技'}</span>
                                <span class="tecnica" style="font-size:11px;color:#94a3b8;">${sp.title_en || ''}</span>
                            </div>
                            <span class="tecnica" style="font-size:10px;color:${badgeColor};letter-spacing:0.5px;">${cost}</span>
                        </div>
                        <div style="font-size:12px;color:#cbd5e1;line-height:1.5;margin-top:4px;">${fmtDossierDesc(sp.desc_zh)}</div>
                    </div>
                `;
            }).join('') : '<div style="font-size:12px;color:#64748b;font-style:italic;">暂无特殊技配置</div>';

            // Section 5: Synergies
            const synContentHtml = synAbs.length ? `
                <div style="display:grid;grid-template-columns:repeat(auto-fit, minmax(280px, 1fr));gap:12px;">
                    ${synAbs.map(s => `
                        <div style="background:rgba(15,23,42,0.6);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;">
                            <div>
                                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
                                    <span style="font-size:13px;font-weight:700;color:#FFF;">${s.title_zh || '协同奖励'}</span>
                                    <span class="tecnica" style="font-size:10px;color:#38bdf8;">${s.title_en || ''}</span>
                                </div>
                                <div style="font-size:12px;color:#94a3b8;line-height:1.5;margin-bottom:8px;">${fmtDossierDesc(s.desc_zh)}</div>
                            </div>
                            ${s.synergy_bots && s.synergy_bots.length ? `
                                <div style="padding-top:8px;border-top:1px solid rgba(255,255,255,0.06);">
                                    ${renderDossierPartnerChips(s.synergy_bots)}
                                </div>
                            ` : ''}
                        </div>
                    `).join('')}
                </div>
            ` : '<div style="font-size:12px;color:#64748b;font-style:italic;">暂无协同加成</div>';

            // Footer
            const footerHtml = `
                <div style="display:flex;justify-content:space-between;align-items:center;padding-top:20px;margin-top:20px;border-top:1px solid #1e293b;font-size:11px;color:#64748b;">
                    <span class="tecnica">TRANSFORMERS: FORGED TO FIGHT // REVIVAL MAINFRAME</span>
                    <span class="tecnica">BOT_ID: ${bot.bot_id}</span>
                </div>
            `;

            // Check Mode: 'long' (Continuous Poster) vs 'tab' (Tabbing View)
            if (gCardViewMode === 'long') {
                body.innerHTML = `
                    <div class="dossier-poster">
                        <div class="dossier-grid-bg"></div>
                        ${headerHtml}
                        ${heroHtml}

                        <!-- 01 DOSSIER -->
                        <div class="dossier-sec-bar">
                            <span class="tecnica" style="font-size:12px;font-weight:700;color:#00F0FF;letter-spacing:1px;">01 // DOSSIER & PROFILE · 机体档案与背景</span>
                            <span class="tecnica" style="font-size:10px;color:#64748b;">DATA SPEC</span>
                        </div>
                        ${loreContentHtml}

                        <!-- 02 SIGNATURE -->
                        <div class="dossier-sec-bar" style="border-left-color:#f59e0b;background:linear-gradient(90deg, rgba(245,158,11,0.18) 0%, rgba(15,23,42,0.04) 75%, transparent 100%);">
                            <span class="tecnica" style="font-size:12px;font-weight:700;color:#f59e0b;letter-spacing:1px;">02 // SIGNATURE ABILITY · 觉醒招牌能力</span>
                            <span class="tecnica" style="font-size:10px;color:#fde047;">AWAKENED</span>
                        </div>
                        ${sigContentHtml}

                        <!-- 03 BASIC & PASSIVE -->
                        <div class="dossier-sec-bar">
                            <span class="tecnica" style="font-size:12px;font-weight:700;color:#00F0FF;letter-spacing:1px;">03 // ABILITIES & PASSIVES · 基础能力与被动特长</span>
                            <span class="tecnica" style="font-size:10px;color:#64748b;">COMBAT SUITE</span>
                        </div>
                        ${basicPassHtml}

                        <!-- 04 SPECIALS -->
                        <div class="dossier-sec-bar">
                            <span class="tecnica" style="font-size:12px;font-weight:700;color:#00F0FF;letter-spacing:1px;">04 // SPECIAL ATTACKS SEQUENCE · 特殊技序列 (SP1~SP3)</span>
                            <span class="tecnica" style="font-size:10px;color:#64748b;">3 STAGES</span>
                        </div>
                        ${spContentHtml}

                        <!-- 05 SYNERGIES -->
                        <div class="dossier-sec-bar">
                            <span class="tecnica" style="font-size:12px;font-weight:700;color:#00F0FF;letter-spacing:1px;">05 // SPARK SYNERGY MATRIX · 战友火种协同</span>
                            <span class="tecnica" style="font-size:10px;color:#64748b;">TEAM BONDS</span>
                        </div>
                        ${synContentHtml}

                        ${footerHtml}
                    </div>
                `;
            } else {
                // 'tab' Mode
                body.innerHTML = `
                    <div class="dossier-poster">
                        <div class="dossier-grid-bg"></div>
                        ${headerHtml}
                        ${heroHtml}

                        <!-- Tabbing Buttons -->
                        <div style="display:flex;gap:8px;border-bottom:1px solid #1e293b;padding-bottom:12px;margin-bottom:16px;flex-wrap:wrap;">
                            <button id="btnDossierTab_abilities" class="dossier-tab-btn ${gDossierActiveTab === 'abilities' ? 'active' : ''}" onclick="switchDossierTab('abilities')">
                                ⚡ 能力
                            </button>
                            <button id="btnDossierTab_specials" class="dossier-tab-btn ${gDossierActiveTab === 'specials' ? 'active' : ''}" onclick="switchDossierTab('specials')">
                                💥 特殊技
                            </button>
                            <button id="btnDossierTab_synergies" class="dossier-tab-btn ${gDossierActiveTab === 'synergies' ? 'active' : ''}" onclick="switchDossierTab('synergies')">
                                🔗 协同
                            </button>
                            <button id="btnDossierTab_lore" class="dossier-tab-btn ${gDossierActiveTab === 'lore' ? 'active' : ''}" onclick="switchDossierTab('lore')">
                                📜 人物设定
                            </button>
                        </div>

                        <!-- Tab 1: Abilities -->
                        <div id="dossierTab_abilities" style="${gDossierActiveTab === 'abilities' ? 'display:block;' : 'display:none;'}">
                            ${basicPassTabHtml}
                        </div>

                        <!-- Tab 2: Specials -->
                        <div id="dossierTab_specials" style="${gDossierActiveTab === 'specials' ? 'display:block;' : 'display:none;'}">
                            ${spContentHtml}
                        </div>

                        <!-- Tab 3: Synergies -->
                        <div id="dossierTab_synergies" style="${gDossierActiveTab === 'synergies' ? 'display:block;' : 'display:none;'}">
                            ${synContentHtml}
                        </div>

                        <!-- Tab 4: Lore -->
                        <div id="dossierTab_lore" style="${gDossierActiveTab === 'lore' ? 'display:block;' : 'display:none;'}">
                            ${loreContentHtml}
                        </div>

                        ${footerHtml}
                    </div>
                `;
            }
        }
        // ==================== END CARD DOSSIER MODAL LOGIC ====================

        // Toast
        function showToast(msg) {
            const t = document.getElementById('toastMsg');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => {
                t.classList.remove('show');
            }, 3000);
        }

        // Start
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
